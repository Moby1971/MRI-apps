<!DOCTYPE html>
<!-- The Primer theme's layout without its site-title link: the banner is the top of the page. -->
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
{% seo title=false %}
    <link rel="icon" href="{{ "/images/favicon.ico" | relative_url }}" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ "/images/favicon-192.png" | relative_url }}">
    <link rel="apple-touch-icon" href="{{ "/images/apple-touch-icon.png" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {{ content }}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
